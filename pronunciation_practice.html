<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>單字拆解發音練習</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8fafc;
      --white: #ffffff;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-400: #94a3b8;
      --gray-800: #1e293b;
      --shadow: 0 4px 16px rgba(0,0,0,.08);
      --shadow-lg: 0 10px 32px rgba(0,0,0,.12);
      --radius: 16px;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--gray-800);
    }
    .banner {
      background: linear-gradient(135deg, #1e3a5f 0%, #1e4d8c 60%, #1a6bc2 100%);
      padding: 44px 24px 60px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .banner::before {
      content: '';
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .banner::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 48px;
      background: var(--bg);
      clip-path: ellipse(60% 100% at 50% 100%);
    }
    .banner-emoji { font-size: 2.8rem; display: block; margin-bottom: 8px; position: relative; }
    .banner h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 800; color: #fff;
      letter-spacing: -0.5px; position: relative;
    }
    .banner .unit-tag {
      display: inline-block; margin-top: 10px;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      color: rgba(255,255,255,.9);
      padding: 4px 16px; border-radius: 30px;
      font-size: .85rem; font-weight: 600; position: relative;
    }
    .container { max-width: 780px; margin: 0 auto; padding: 0 20px 60px; }
    .how-to {
      background: #f0fdfa; border: 1.5px solid #99f6e4;
      border-radius: var(--radius); padding: 18px 22px;
      margin-bottom: 28px; display: flex; gap: 14px; align-items: flex-start;
    }
    .how-to .ht-icon { font-size: 1.5rem; flex-shrink: 0; margin-top: 1px; }
    .how-to h2 { font-size: .95rem; font-weight: 700; color: #0d9488; margin-bottom: 4px; }
    .how-to p  { font-size: .83rem; color: #134e4a; line-height: 1.65; }
    .mode-bar {
      display: flex; gap: 6px; margin-bottom: 24px;
      background: var(--white); border-radius: 12px;
      padding: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .mode-btn {
      flex: 1; padding: 8px 12px; border: none; border-radius: 8px;
      font-family: inherit; font-size: .82rem; font-weight: 700;
      cursor: pointer; background: transparent; color: var(--gray-400);
      transition: background .15s, color .15s;
    }
    .mode-btn.selected { background: var(--gray-800); color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
    .card {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 26px 20px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      border: 2px solid transparent;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      opacity: 0; transform: translateY(20px);
      animation: rise .45s ease forwards;
    }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .card.active { border-color: var(--accent-color); background: color-mix(in srgb, var(--accent-color) 4%, white); }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    .card:nth-child(1){animation-delay:.05s} .card:nth-child(2){animation-delay:.10s}
    .card:nth-child(3){animation-delay:.15s} .card:nth-child(4){animation-delay:.20s}
    .card:nth-child(5){animation-delay:.25s} .card:nth-child(6){animation-delay:.30s}
    .card:nth-child(7){animation-delay:.35s} .card:nth-child(8){animation-delay:.40s}
    .card-accent { width: 36px; height: 5px; border-radius: 4px; background: var(--accent-color); margin-bottom: 4px; }
    .word-text { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.5px; }
    .syllable-display { display: flex; align-items: center; gap: 2px; font-size: .85rem; font-weight: 700; letter-spacing: 1px; }
    .syl-part {
      padding: 3px 8px; border-radius: 6px;
      background: var(--gray-100); color: var(--gray-400);
      transition: background .15s, color .15s, transform .15s;
    }
    .syl-part.lit { background: var(--accent-color); color: #fff; transform: scale(1.12); }
    .syl-sep { color: var(--gray-400); font-weight: 400; font-size: .8rem; padding: 0 1px; }
    .play-btn {
      margin-top: 10px; width: 52px; height: 52px;
      border-radius: 50%; border: none; cursor: pointer;
      background: var(--accent-color);
      box-shadow: 0 4px 14px color-mix(in srgb, var(--accent-color) 45%, transparent);
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s ease; position: relative;
    }
    .play-btn:hover { transform: scale(1.1); }
    .play-btn:active { transform: scale(.93); }
    .play-btn svg { fill: #fff; width: 20px; height: 20px; pointer-events: none; }
    .play-btn::after {
      content: ''; position: absolute; inset: 0;
      border-radius: 50%; border: 2px solid var(--accent-color); opacity: 0;
    }
    .play-btn.ripple::after { animation: ripple .6s ease-out forwards; }
    @keyframes ripple {
      from { transform: scale(1);   opacity: .7; }
      to   { transform: scale(1.9); opacity: 0;  }
    }
    .prog-wrap { width: 100%; height: 3px; background: var(--gray-200); border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .prog-fill  { height: 100%; width: 0%; background: var(--accent-color); border-radius: 3px; transition: width .08s linear; }
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: #1e293b; color: #fff;
      padding: 9px 22px; border-radius: 30px;
      font-size: .84rem; font-weight: 600;
      pointer-events: none; z-index: 1000;
      white-space: nowrap;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    footer { text-align: center; padding: 24px; font-size: .75rem; color: var(--gray-400); }
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr 1fr; gap: 14px; }
      .card { padding: 20px 14px 16px; }
      .word-text { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="banner">
  <span class="banner-emoji">🎯</span>
  <h1>Pronunciation Practice</h1>
  <span class="unit-tag">Unit 2: Jobs & Actions</span>
</div>

<div class="container">
  <div class="how-to">
    <span class="ht-icon">📚</span>
    <div>
      <h2>How to Practice</h2>
      <p>Click the play button on each card to hear the correct pronunciation. Listen carefully to how each word is broken down into syllables, then practice saying it yourself!</p>
    </div>
  </div>

  <div class="mode-bar" id="modeBar">
    <button class="mode-btn selected" data-mode="syllable">🔤 音節拆解唸法</button>
    <button class="mode-btn"          data-mode="full">🔊 完整單字唸法</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<footer>made with ❤️</footer>
<div class="toast" id="toast"></div>

<script>
const WORDS = [
  { word: 'artist',  display: ['art','ist'],   tts: ['art','ist'],    sep: '-', color: '#f97316' },
  { word: 'dentist', display: ['dent','ist'],  tts: ['dent','ist'],   sep: '-', color: '#0d9488' },
  { word: 'farmer',  display: ['farm','er'],   tts: ['farm','er'],    sep: '-', color: '#7c3aed' },
  { word: 'singer',  display: ['sing','er'],   tts: ['sing','er'],    sep: '-', color: '#db2777' },
  { word: 'write',   display: ['wr','ite'],    tts: ['ra','eye'],     sep: '-', color: '#2563eb' },
  { word: 'drive',   display: ['dr','ive'],    tts: ['dra','eye'],    sep: '-', color: '#16a34a' },
  { word: 'police',  display: ['po','lice'],   tts: ['po','leece'],   sep: '-', color: '#dc2626' },
  { word: 'office',  display: ['of','fice'],   tts: ['off','fiss'],   sep: '-', color: '#0891b2' },
];

const PLAY_SVG = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
const STOP_SVG = `<svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>`;

const grid    = document.getElementById('grid');
const toast   = document.getElementById('toast');
const modeBar = document.getElementById('modeBar');

let playMode = 'syllable', activeCard = null, progTimer = null, sylTimers = [];

modeBar.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    stopAll();
    modeBar.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    playMode = btn.dataset.mode;
  });
});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2400);
}

function stopAll() {
  window.speechSynthesis.cancel();
  clearInterval(progTimer);
  sylTimers.forEach(clearTimeout);
  sylTimers = [];
  if (activeCard) {
    activeCard.btn.innerHTML = PLAY_SVG;
    activeCard.card.classList.remove('active');
    activeCard.fill.style.width = '0%';
    activeCard.parts.forEach(p => p.classList.remove('lit'));
    activeCard = null;
  }
}

function speak(text, rate = 0.78) {
  return new Promise((resolve, reject) => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate; u.pitch = 1.05;
    u.onend = resolve; u.onerror = reject;
    window.speechSynthesis.speak(u);
  });
}

function pause(ms) {
  return new Promise(r => { const t = setTimeout(r, ms); sylTimers.push(t); });
}

async function playSyllables(wordData, parts) {
  const { tts, word } = wordData;
  for (let i = 0; i < tts.length; i++) {
    if (!activeCard) return;
    parts.forEach((p, j) => p.classList.toggle('lit', j === i));
    await speak(tts[i], tts[i].length <= 3 ? 0.65 : 0.75);
    if (i < tts.length - 1) await pause(350);
  }
  parts.forEach(p => p.classList.remove('lit'));
  await pause(450);
  if (!activeCard) return;
  parts.forEach(p => p.classList.add('lit'));
  await speak(word, 0.82);
  parts.forEach(p => p.classList.remove('lit'));
}

WORDS.forEach((wordData) => {
  const { word, display, sep, color } = wordData;
  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--accent-color', color);

  const stripe = document.createElement('div');
  stripe.className = 'card-accent';

  const wordEl = document.createElement('div');
  wordEl.className = 'word-text';
  wordEl.textContent = word;

  const sylDisplay = document.createElement('div');
  sylDisplay.className = 'syllable-display';
  const sylParts = [];
  display.forEach((part, i) => {
    const span = document.createElement('span');
    span.className = 'syl-part';
    span.textContent = part;
    sylParts.push(span);
    sylDisplay.appendChild(span);
    if (i < display.length - 1) {
      const dash = document.createElement('span');
      dash.className = 'syl-sep';
      dash.textContent = sep;
      sylDisplay.appendChild(dash);
    }
  });

  const btn = document.createElement('button');
  btn.className = 'play-btn';
  btn.setAttribute('aria-label', `Play ${word}`);
  btn.innerHTML = PLAY_SVG;

  const progWrap = document.createElement('div');
  progWrap.className = 'prog-wrap';
  const fill = document.createElement('div');
  fill.className = 'prog-fill';
  progWrap.appendChild(fill);

  card.append(stripe, wordEl, sylDisplay, btn, progWrap);
  grid.appendChild(card);

  btn.addEventListener('click', async () => {
    const alreadyPlaying = activeCard && activeCard.card === card;
    stopAll();
    if (alreadyPlaying) return;
    if (!('speechSynthesis' in window)) { showToast('⚠️ 瀏覽器不支援語音功能'); return; }

    card.classList.add('active');
    btn.innerHTML = STOP_SVG;
    btn.classList.add('ripple');
    setTimeout(() => btn.classList.remove('ripple'), 650);
    activeCard = { card, btn, fill, parts: sylParts };

    let pct = 0;
    fill.style.width = '0%';
    const totalDur = playMode === 'syllable' ? wordData.tts.length * 700 + 1000 : word.length * 190 + 500;
    progTimer = setInterval(() => {
      pct = Math.min(pct + (90 / (totalDur / 80)), 90);
      fill.style.width = pct + '%';
    }, 80);

    try {
      if (playMode === 'syllable') await playSyllables(wordData, sylParts);
      else await speak(word, 0.82);
      clearInterval(progTimer);
      fill.style.width = '100%';
      await pause(280);
      stopAll();
      showToast(`✅  ${word}  ·  ${display.join(sep)}`);
    } catch {
      stopAll();
      showToast('⚠️ 播放失敗，請再試');
    }
  });
});
</script>
</body>
</html>
